name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  workflow_dispatch:

jobs:
  test:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ['3.2', '3.3', '3.4']

    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        # To automatically get bug fixes and new Ruby versions for ruby/setup-ruby,
        # change this to (see https://github.com/ruby/setup-ruby#versioning):
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - name: Run RSpec tests
        run: bundle exec rspec spec
      - name: "Tar files"
        if: ${{ success() || failure() }}
        run: tar -cvf rspec-tests-${{ matrix.ruby-version }}.tar reports/rspec-test-results.html
      - uses: actions/upload-artifact@v4
        if: ${{ success() || failure() }}
        with:
          name: rspec-tests-${{ matrix.ruby-version }}
          path: rspec-tests-${{ matrix.ruby-version }}.tar
          retention-days: 14

      - name: Run Cucumber tests
        run: bundle exec cucumber
      - name: "Tar files"
        if: ${{ success() || failure() }}
        run: tar -cvf cucumber-tests-${{ matrix.ruby-version }}.tar reports/cucumber-test-results.html
      - uses: actions/upload-artifact@v4
        if: ${{ success() || failure() }}
        with:
          name: cucumber-tests-${{ matrix.ruby-version }}
          path: cucumber-tests-${{ matrix.ruby-version }}.tar
          retention-days: 14
